<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#16231d;color:#fff;
       font-family:'Plus Jakarta Sans',system-ui,sans-serif;
       display:flex;flex-direction:column;justify-content:center;
       padding:84px 96px;position:relative;overflow:hidden}
  .glow{position:absolute;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(circle,rgba(46,158,95,.34) 0%,rgba(46,158,95,0) 68%);
        right:-190px;top:-230px}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:52px;position:relative}
  .brand span{font-family:'Outfit',sans-serif;font-weight:700;font-size:46px;letter-spacing:-.02em}
  h1{font-family:'Outfit',sans-serif;font-weight:700;font-size:70px;line-height:1.1;
     letter-spacing:-.025em;max-width:930px;position:relative}
  h1 em{font-style:normal;color:#56c68a}
  p{margin-top:30px;font-size:29px;color:#a3b0a8;max-width:820px;position:relative}
  .rule{margin-top:46px;display:flex;gap:14px;position:relative}
  .rule i{font-style:normal;font-size:21px;font-weight:500;color:#c9e6d6;
          border:1px solid rgba(201,230,214,.28);border-radius:999px;padding:11px 22px}
</style></head><body>
  <div class="glow"></div>
  <div class="brand">
    <svg width="64" height="64" viewBox="0 0 48 48" fill="none">
      <path d="M9 24a15 15 0 0 1 15-15c5.2 0 9.8 2.6 12.5 6.6" stroke="#38b06f" stroke-width="6" stroke-linecap="round"/>
      <path d="M38 6.5V16h-9.5" stroke="#38b06f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M39 24a15 15 0 0 1-15 15c-5.2 0-9.8-2.6-12.5-6.6" stroke="#38b06f" stroke-width="6" stroke-linecap="round"/>
      <path d="M10 41.5V32h9.5" stroke="#38b06f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>swaloop</span>
  </div>
  <h1>İhtiyacın olanı,<br><em>elindekini takas ederek</em> bul.</h1>
  <p>Elimde var × İhtiyacım var × Başkasında var = Takas</p>
  <div class="rule"><i>Para yok</i><i>Fiyat yok</i><i>Sadece takas</i></div>
</body></html>
